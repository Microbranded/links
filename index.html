<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MicroBranded — find me across the web">
  <meta name="theme-color" content="#0a0a0a">
  <title>MicroBranded — Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    body { display: flex; flex-direction: column; align-items: center; padding: 48px 20px 64px; max-width: 100%; }
    .avatar { width: 96px; height: 96px; border-radius: 22px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(255, 122, 0, 0.25); }
    .avatar svg { display: block; width: 100%; height: 100%; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .tagline { font-size: 14px; color: #888; margin-bottom: 36px; }
    .links { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 420px; }
    .link { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 14px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; text-decoration: none; font-size: 16px; font-weight: 600; transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease; }
    .link:hover, .link:active { transform: scale(0.98); background: #232323; border-color: #3a3a3a; }
    .link .icon { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; }
    .link .icon img { width: 22px; height: 22px; display: block; }
    .link .label { flex: 1; }
    .link .arrow { color: #555; font-size: 18px; }
    .ig .icon { background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }
    .tiktok .icon { background: #000; border: 1px solid #2a2a2a; }
    .threads .icon { background: #000; border: 1px solid #2a2a2a; }
    .x .icon { background: #000; border: 1px solid #2a2a2a; }
    .linkedin .icon { background: #0a66c2; }
    .bluesky .icon { background: #1185fe; }
    .facebook .icon { background: #1877f2; }
    footer { margin-top: 48px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <div class="avatar">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="MicroBranded">
      <rect width="100" height="100" fill="#0a0a0a"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="5"/>
      <polygon points="40,30 72,50 40,70" fill="#ff7a00"/>
    </svg>
  </div>
  <h1>MicroBranded</h1>
  <p class="tagline">@microbranded</p>
  <div class="links">
    <a href="https://www.instagram.com/microbranded" class="link ig" target="_blank" rel="noopener">
      <span class="icon"><img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="" width="22" height="22"></span>
      <span class="label">Instagram</span>
      <span class="arrow">›</span>
    </a>
    <a href="https://www.tiktok.com/@microbranded" class="link tiktok" target="_blank" rel="noopener">
      <span class="icon"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="" width="22" height="22"></span>
      <span class="label">TikTok</span>
      <span class="arrow">›</span>
    </a>
    <a href="https://www.threads.com/@microbranded" class="link threads" target="_blank" rel="noopener">
      <span class="icon"><img src="https://cdn.simpleicons.org/threads/FFFFFF" alt="" width="22" height="22"></span>
      <span class="label">Threads</span>
      <span class="arrow">›</span>
    </a>
    <a href="https://x.com/MicroBranded" class="link x" target="_blank" rel="noopener">
      <span class="icon"><img src="https://cdn.simpleicons.org/x/FFFFFF" alt="" width="20" height="20"></span>
      <span class="label">X (Twitter)</span>
      <span class="arrow">›</span>
    </a>
    <a href="https://www.linkedin.com/company/microbranded" class="link linkedin" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg" fill="#ffffff" width="20" height="20" aria-label="LinkedIn">
          <path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z"/>
        </svg>
      </span>
      <span class="label">LinkedIn</span>
      <span class="arrow">›</span>
    </a>
    <a href="https://bsky.app/profile/microbranded.bsky.social" class="link bluesky" target="_blank" rel="noopener">
      <span class="icon"><img src="https://cdn.simpleicons.org/bluesky/FFFFFF" alt="" width="22" height="22"></span>
      <span class="label">Bluesky</span>
      <span class="arrow">›</span>
    </a>
    <a href="https://www.facebook.com/MicroBranded" class="link facebook" target="_blank" rel="noopener">
      <span class="icon"><img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt="" width="22" height="22"></span>
      <span class="label">Facebook</span>
      <span class="arrow">›</span>
    </a>
  </div>
  <footer>microbrandedstudio.com</footer>
</body>
</html>
